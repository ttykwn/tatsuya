<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fcf8ea;--ink:#1d2b2f;--muted:#6a746f;--green:#166651;--ng:#b8573f;--line:#e6dfc9}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:1200px;background:var(--paper);font-family:"Noto Sans JP",sans-serif;color:var(--ink);padding:84px 84px 64px;display:flex;flex-direction:column}
  .model{display:flex;align-items:center;gap:22px}
  .model b{font-family:Inter,sans-serif;font-weight:800;font-size:104px;letter-spacing:-.02em;color:var(--green);line-height:1}
  .phone{width:58px;height:100px;border:7px solid var(--green);border-radius:14px;position:relative}
  .phone:after{content:"";position:absolute;left:50%;top:9px;width:18px;height:5px;margin-left:-9px;border-radius:3px;background:var(--green)}
  h1{margin-top:26px;font-size:66px;font-weight:900;line-height:1.3}
  .rows{margin-top:56px;display:flex;flex-direction:column;gap:22px}
  .row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:3px solid var(--line);border-radius:22px;padding:34px 40px}
  .row .w{font-size:46px;font-weight:900}
  .row .w small{display:block;font-size:26px;font-weight:700;color:var(--muted);margin-top:4px}
  .row .r{font-size:40px;font-weight:900;text-align:right}
  .row .r small{display:block;font-size:24px;font-weight:700;color:var(--muted);margin-top:4px}
  .row .r small.ng{color:var(--ng)}
  .best{background:var(--green);border-color:var(--green);color:#fff}
  .best .w small,.best .r small{color:#cfe6da}
  .best .r{color:#fff}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
  .foot p{font-size:26px;color:var(--muted);font-weight:500}
  .foot .brand{font-size:24px;letter-spacing:.12em}
</style></head><body>
  <div class="model"><b>iPhone 18 Pro</b><span class="phone"></span></div>
  <h1>手持ちの充電器で足りる？</h1>

  <div class="rows">
    <div class="row">
      <div class="w">20W〜45W</div>
      <div class="r">充電できる<small class="ng">15分で最大50%は ×</small></div>
    </div>
    <div class="row">
      <div class="w">60W以上<small>AVS非対応</small></div>
      <div class="r">充電できる<small class="ng">15分で最大50%は ×</small></div>
    </div>
    <div class="row best">
      <div class="w">60W以上<small>AVS対応（純正など）</small></div>
      <div class="r">最速充電 ◎<small>15分で最大50%（Apple公称）</small></div>
    </div>
  </div>

  <div class="foot">
    <p>夜に充電するだけなら、今の充電器でOK</p>
    <p class="brand">Norra Office</p>
  </div>
</body></html>
